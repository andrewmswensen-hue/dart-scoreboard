<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Darts">
<meta name="description" content="Darts scoreboard for X01 and Cricket with computer opponents, statistics and the One Bust, Low Score house rule.">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png" sizes="192x192">
<link rel="manifest" href="manifest.webmanifest">
<title>Dart Scoreboard</title>
<style>
/* Layout: one centered phone column (max 480px), floating pill tab bar, full-screen game view.
   Dark-first palette from the brief; light variant for System/Light themes. */
:root {
  --page: #000; --header: #1c1c1e; --card: #2c2c2e; --card2: #3a3a3c; --text: #fff; --muted: #8e8e93;
  --sep: #3a3a3c; --key: #3a3a3c; --key-text: #fff; --box: #000; --box-text: #fff;
  --green: #4f9f5a; --green-btn: #3f9d4b; --red: #e53935; --amber: #f5a623; --on-amber: #1c1c1e;
  --bot: #ff9500; --accent: #30d158; --accent-soft: rgba(48, 209, 88, .18); --bar: #5ccb6b;
  --seg-bg: #1c1c1e; --seg-sel: #636366; --tab-bg: rgba(28, 28, 30, .94); --overlay: rgba(0, 0, 0, .6);
  --grid: rgba(255, 255, 255, .14); --danger: #ff6961; --on-color: #fff; --shadow: 0 10px 30px rgba(0, 0, 0, .5);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]):not([data-app-theme="dark"]) {
    --page: #f2f2f7; --header: #fff; --card: #fff; --card2: #ececf1; --text: #000; --muted: #6c6c70;
    --sep: #d1d1d6; --key: #e5e5ea; --key-text: #000; --box: #1c1c1e; --box-text: #fff;
    --green: #3f8f4a; --green-btn: #34843f; --red: #d32f2f; --bot: #b35900; --accent: #1f8a3b;
    --accent-soft: rgba(31, 138, 59, .14); --bar: #2e9e48; --seg-bg: #e3e3e8; --seg-sel: #fff;
    --tab-bg: rgba(255, 255, 255, .95); --overlay: rgba(0, 0, 0, .35); --grid: rgba(0, 0, 0, .12);
    --danger: #c62828; --shadow: 0 10px 30px rgba(0, 0, 0, .15); color-scheme: light;
  }
}
:root[data-theme="light"]:not([data-app-theme="dark"]), :root[data-app-theme="light"] {
  --page: #f2f2f7; --header: #fff; --card: #fff; --card2: #ececf1; --text: #000; --muted: #6c6c70;
  --sep: #d1d1d6; --key: #e5e5ea; --key-text: #000; --box: #1c1c1e; --box-text: #fff;
  --green: #3f8f4a; --green-btn: #34843f; --red: #d32f2f; --bot: #b35900; --accent: #1f8a3b;
  --accent-soft: rgba(31, 138, 59, .14); --bar: #2e9e48; --seg-bg: #e3e3e8; --seg-sel: #fff;
  --tab-bg: rgba(255, 255, 255, .95); --overlay: rgba(0, 0, 0, .35); --grid: rgba(0, 0, 0, .12);
  --danger: #c62828; --shadow: 0 10px 30px rgba(0, 0, 0, .15); color-scheme: light;
}
:root[data-app-theme="dark"] { color-scheme: dark; }

/* Safe areas: installed on a phone (standalone), keep a small extra buffer
   clear of the camera notch and the home indicator. */
:root { --safe-t: env(safe-area-inset-top, 0px); --safe-b: env(safe-area-inset-bottom, 0px); }
@media (display-mode: standalone) {
  :root { --safe-t: calc(env(safe-area-inset-top, 0px) + 8px); --safe-b: calc(env(safe-area-inset-bottom, 0px) + 6px); }
  .notch-shim { display: block; }
}
.notch-shim { display: none; position: fixed; top: 0; left: 0; right: 0; height: var(--safe-t); background: #000; z-index: 45; pointer-events: none; }
html { height: 100%; box-sizing: border-box; background: var(--page); padding-top: var(--safe-t); }
*, *::before, *::after { box-sizing: border-box; }
body { min-height: 100%; margin: 0; background: var(--page); color: var(--text); font-family: var(--font); font-size: 15px;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { cursor: not-allowed; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.bot-name { color: var(--bot) !important; }
.num { font-variant-numeric: tabular-nums; }
svg { display: block; }

/* ---------- app shell ---------- */
.app { max-width: 480px; margin: 0 auto; padding-inline: 16px; padding-block: 8px calc(110px + var(--safe-b)); }
.topbar { position: sticky; top: var(--safe-t); z-index: 5; display: grid; grid-template-columns: 44px 1fr 44px;
  align-items: center; min-height: 56px; margin-inline: -16px; padding-inline: 16px; background: var(--page); }
.topbar h1 { margin: 0; text-align: center; font-size: 17px; font-weight: 700; }
.home-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px 14px; }
.home-head h1 { margin: 0; font-size: clamp(28px, 8.5vw, 34px); font-weight: 800; letter-spacing: -.02em; }
.circle-btn { width: 44px; height: 44px; border-radius: 50%; background: var(--green-btn); color: var(--on-color);
  display: grid; place-items: center; flex: none; }
.circle-btn svg { width: 22px; height: 22px; }
.icon-plain { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); border-radius: 12px; flex: none; }
.icon-plain svg { width: 22px; height: 22px; }
.section-h { font-size: 22px; font-weight: 800; margin: 26px 0 12px; }

/* ---------- segmented ---------- */
.seg { display: flex; background: var(--seg-bg); border-radius: 999px; padding: 3px; gap: 2px; margin-block: 6px 14px; }
.seg button { flex: 1; min-height: 38px; border-radius: 999px; font-weight: 700; font-size: 15px; color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--seg-sel); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seg.small button { font-size: 13px; min-height: 34px; }

/* ---------- home tiles ---------- */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 10px; }
.tile-wrap { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tile-wrap.full { grid-column: 1 / -1; }
.tile-wrap.span2 { grid-column: span 2; }
.tile-label { font-size: 13px; font-weight: 700; color: var(--text); padding-left: 4px; }
.tile { min-height: 58px; border-radius: 16px; color: var(--on-color); font-weight: 800; font-size: 17px; line-height: 1.15;
  padding: 6px 8px; display: grid; place-items: center; text-align: center; overflow-wrap: anywhere; }
.tile.green { background: var(--green); }
.tile.red { background: var(--red); }
.tile.amber { background: var(--amber); color: var(--on-amber); }
.tile.off { opacity: .9; }
.format-note { color: var(--muted); font-size: 13px; margin: 10px 4px 0; }
.btn-start { width: 100%; min-height: 56px; margin-top: 18px; border-radius: 999px; background: var(--red); color: var(--on-color);
  font-size: 20px; font-weight: 800; letter-spacing: .08em; }
.btn-start:disabled { opacity: .45; }
.hint { color: var(--muted); font-size: 13px; text-align: center; margin: 8px 0 0; }
.home-actions { display: flex; align-items: center; gap: 10px; margin-top: 16px; }
.check { display: flex; align-items: center; gap: 10px; min-height: 44px; font-weight: 700; flex: 1; min-width: 0; cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }
.pill-btn { min-height: 44px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; gap: 8px; font-weight: 700;
  background: var(--card); color: var(--text); white-space: nowrap; }
.pill-btn.green { background: var(--green-btn); color: var(--on-color); }
.pill-btn.red { background: var(--red); color: var(--on-color); }
.pill-btn.amber { background: var(--amber); color: var(--on-amber); }
.pill-btn svg { width: 20px; height: 20px; flex: none; }
.sq-btn { width: 48px; height: 44px; border-radius: 999px; background: var(--green-btn); color: var(--on-color); display: grid; place-items: center; flex: none; }
.sq-btn svg { width: 24px; height: 24px; }
.resume-card { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 12px 14px; margin-bottom: 14px; }
.resume-card > div { flex: 1; min-width: 0; }
.resume-card strong { display: block; }
.resume-card span { color: var(--muted); font-size: 13px; }

/* ---------- lists ---------- */
.list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 4px 4px 4px 12px; background: var(--card); border-radius: 14px;
  position: relative; touch-action: pan-y; }
.row.dragging { z-index: 3; box-shadow: var(--shadow); transition: none; opacity: .95; }
.row.shift { transition: transform .15s ease; }
.row .dart-ic { width: 26px; height: 26px; color: var(--muted); flex: none; }
.row .dart-ic.on { color: var(--accent); }
.row-main { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; text-align: left; min-height: 48px; }
.row-name { font-weight: 800; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row-sub { color: var(--muted); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.drag-handle { width: 44px; height: 44px; display: grid; place-items: center; color: var(--muted); touch-action: none; cursor: grab; flex: none; border-radius: 10px; }
.drag-handle svg { width: 22px; height: 22px; }
.empty { text-align: center; color: var(--muted); background: var(--card); border-radius: 16px; padding: 28px 18px; }
.empty strong { display: block; color: var(--text); font-size: 17px; margin-bottom: 6px; }
.empty svg { width: 40px; height: 40px; margin: 0 auto 10px; color: var(--muted); }

/* ---------- tab bar ---------- */
.tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(8px + var(--safe-b)); z-index: 20;
  width: min(448px, calc(100% - 24px)); display: grid; grid-template-columns: repeat(5, 1fr); gap: 2px; padding: 6px;
  background: var(--tab-bg); border-radius: 30px; box-shadow: var(--shadow); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 52px; border-radius: 24px;
  color: var(--muted); font-size: 11px; font-weight: 700; }
.tab svg { width: 24px; height: 24px; }
.tab[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }
.tab span { white-space: nowrap; }

/* ---------- tables ---------- */
.stat-h { text-align: center; font-size: 22px; font-weight: 800; margin: 28px 0 10px; }
.stat-h .info-btn { display: inline-grid; vertical-align: middle; width: 30px; height: 30px; margin-left: 4px; color: var(--muted); place-items: center; }
.stat-h .info-btn svg { width: 20px; height: 20px; }
.table-wrap { overflow-x: auto; border-radius: 12px; }
table.stat { width: 100%; border-collapse: collapse; font-size: 15px; table-layout: fixed; }
table.stat th { background: var(--header); color: var(--muted); font-weight: 600; font-size: 13px; padding: 10px 4px; text-align: center; }
table.stat th:first-child { text-align: left; padding-left: 10px; width: 34%; }
table.stat td { padding: 11px 4px; text-align: center; font-weight: 700; font-variant-numeric: tabular-nums; }
table.stat td:first-child { text-align: left; padding-left: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.stat tbody tr:nth-child(odd) { background: var(--card); }
table.stat tbody tr:nth-child(even) { background: var(--card2); }
.pidx { color: var(--muted); font-size: 12px; font-weight: 600; margin-right: 4px; }
.no-data { background: var(--card); border-radius: 12px; padding: 18px; text-align: center; color: var(--muted); }
.popover { background: var(--card2); border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 13px; line-height: 1.45; margin: 0 0 10px; }
.chart-card { background: var(--card); border-radius: 14px; padding: 12px 8px 8px; margin-bottom: 12px; }
.chart-card h3 { margin: 0 0 6px 6px; font-size: 16px; font-weight: 800; }
.chart-scroll { overflow-x: auto; }
.chart-scroll svg text { font-family: var(--font); }

/* ---------- games ---------- */
.filters { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.filters .seg { flex: 1; margin: 0; }
.select { min-height: 40px; border-radius: 12px; background: var(--card); border: 0; padding: 0 10px; max-width: 45%; }
.game-item { background: var(--card); border-radius: 16px; overflow: hidden; }
.gi-main { display: block; width: 100%; text-align: left; padding: 12px 14px 8px; }
.gi-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.chip { display: inline-block; font-size: 12px; font-weight: 800; padding: 3px 8px; border-radius: 999px; background: var(--card2); color: var(--text); }
.chip.amber { background: var(--amber); color: var(--on-amber); }
.chip.green { background: var(--accent-soft); color: var(--accent); }
.chip.muted { color: var(--muted); }
.gi-settings { font-weight: 700; margin-top: 6px; }
.gi-players { color: var(--muted); font-size: 14px; margin-top: 2px; }
.gi-result { margin-top: 6px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
.gi-result svg { width: 18px; height: 18px; color: var(--amber); }
.gi-actions { display: flex; justify-content: flex-end; gap: 6px; padding: 0 8px 8px; }

/* ---------- settings ---------- */
.group { background: var(--card); border-radius: 14px; overflow: hidden; margin-bottom: 18px; }
.group-title { color: var(--muted); font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; margin: 20px 6px 8px; }
.srow { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 6px 14px; width: 100%; text-align: left; }
.srow + .srow { border-top: 1px solid var(--sep); }
.srow .grow { flex: 1; min-width: 0; }
.srow .grow small { display: block; color: var(--muted); font-size: 12px; }
.srow.danger { color: var(--danger); font-weight: 700; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; z-index: 1; }
.switch span { position: absolute; inset: 0; border-radius: 999px; background: var(--card2); transition: background .15s; }
.switch span::after { content: ""; position: absolute; width: 27px; height: 27px; top: 2px; left: 2px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .35); transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(20px); }
.switch input:focus-visible + span { outline: 3px solid var(--accent); outline-offset: 2px; }
.switch.amber input:checked + span { background: var(--amber); }

/* ---------- sheets and dialogs ---------- */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; }
.sheet { width: 100%; max-width: 480px; max-height: 88vh; max-height: 88dvh; overflow-y: auto; background: var(--header); border-radius: 22px 22px 0 0;
  padding: 8px 16px calc(18px + var(--safe-b)); box-shadow: var(--shadow); animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .sheet, .toast { animation: none !important; } .row.shift, .switch span, .switch span::after { transition: none; } }
.grabber { width: 38px; height: 5px; border-radius: 3px; background: var(--card2); margin: 2px auto 8px; }
.sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.sheet-head h2 { flex: 1; margin: 0; font-size: 20px; font-weight: 800; }
.sheet p { line-height: 1.45; }
.opt-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.opt-grid.cols7 { grid-template-columns: repeat(7, minmax(0, 1fr)); }
.opt { min-height: 48px; border-radius: 12px; background: var(--card); font-weight: 800; font-size: 16px; padding: 4px; }
.opt[aria-pressed="true"] { background: var(--green); color: var(--on-color); }
.opt.red[aria-pressed="true"] { background: var(--red); }
.opt:disabled { opacity: .3; }
.opt-list { display: flex; flex-direction: column; gap: 8px; }
.opt-list .opt { text-align: left; padding: 10px 14px; }
.opt-list .opt small { display: block; font-weight: 500; color: inherit; opacity: .75; font-size: 13px; margin-top: 2px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-block: 12px; }
.field label, .field .lbl { font-size: 13px; font-weight: 700; color: var(--muted); }
.input { min-height: 46px; border-radius: 12px; border: 1px solid var(--sep); background: var(--card); padding: 0 12px; width: 100%; }
textarea.input { padding: 10px 12px; min-height: 140px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; }
.inline { display: flex; gap: 8px; align-items: center; }
.inline .input { flex: 1; min-width: 0; }
.btn-row { display: flex; gap: 10px; margin-top: 16px; }
.btn-row > * { flex: 1; justify-content: center; }
.stepper { display: flex; align-items: center; gap: 10px; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; background: var(--card); font-size: 22px; font-weight: 800; }
.stepper output { min-width: 28px; text-align: center; font-weight: 800; font-size: 20px; }
.rule-list { margin: 8px 0; padding-left: 20px; color: var(--text); font-size: 14px; line-height: 1.5; }
.rule-list li + li { margin-top: 4px; }
.dialog-wrap { position: fixed; inset: 0; z-index: 60; background: var(--overlay); display: grid; place-items: center; padding: 16px; }
.dialog { width: 100%; max-width: 360px; background: var(--header); border-radius: 18px; padding: 20px; box-shadow: var(--shadow); }
.dialog h2 { margin: 0 0 8px; font-size: 19px; }
.dialog p { margin: 0; color: var(--muted); line-height: 1.45; }
.dialog .btn-row { flex-wrap: wrap; }
.toast-root { position: fixed; left: 0; right: 0; top: calc(64px + var(--safe-t)); z-index: 80; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding-inline: 16px; }
.toast { background: var(--card2); color: var(--text); border-radius: 14px; padding: 11px 16px; font-weight: 700; box-shadow: var(--shadow); max-width: 440px; text-align: center; animation: up .2s ease-out; }
.toast.amber { background: var(--amber); color: var(--on-amber); }
.toast.red { background: var(--red); color: var(--on-color); }
.test-row { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--sep); font-size: 14px; }
.test-row b { flex: none; width: 44px; }
.test-row .ok { color: var(--accent); }
.test-row .bad { color: var(--danger); }
.test-row small { display: block; color: var(--muted); }

/* ---------- game screen ---------- */
.game { position: fixed; inset: 0; z-index: 30; background: var(--page); padding-top: var(--safe-t); padding-bottom: var(--safe-b); }
.game-inner { max-width: 480px; height: 100%; margin: 0 auto; display: flex; flex-direction: column; }
.game-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; padding: 4px 8px; min-height: 50px; }
.game-title { text-align: center; line-height: 1.2; min-width: 0; }
.game-title strong { display: block; font-size: 15px; }
.game-title span { color: var(--muted); font-size: 12px; }
.banner { margin: 0 12px 6px; border-radius: 14px; background: var(--amber); color: var(--on-amber); padding: 8px 12px; font-weight: 800; }
.banner .tracker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; font-size: 12px; }
.banner .tracker span { border-radius: 999px; padding: 2px 8px; border: 1.5px solid currentColor; }
.banner .tracker span.done { opacity: .5; text-decoration: line-through; }
.banner .tracker span.now { background: var(--on-amber); color: var(--amber); border-color: var(--on-amber); }
.cards { flex: 1; overflow-y: auto; padding: 2px 12px 8px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
.pcard { position: relative; background: var(--card); border-radius: 18px; padding: 12px 12px 12px 18px; display: grid;
  grid-template-columns: minmax(0, 1.1fr) auto minmax(0, .95fr); gap: 10px; align-items: center; overflow: hidden; }
.pcard.active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 7px; background: var(--accent); }
.pc-left { min-width: 0; }
.pc-score { font-size: clamp(42px, 13vw, 62px); font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.pc-name { color: var(--muted); font-weight: 700; font-size: 15px; margin-top: 4px; display: flex; align-items: center; gap: 4px; min-width: 0; }
.pc-name span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-name svg { width: 16px; height: 16px; flex: none; color: var(--accent); }
.pc-hr { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 12px; color: var(--muted); font-weight: 700; flex-wrap: wrap; }
.pip { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--amber); display: inline-block; }
.pip.on { background: var(--amber); }

<div class="notch-shim" aria-hidden="true"></div>
<div id="screen-root"></div>
<div id="sheet-root"></div>
<div id="dialog-root"></div>
<div id="toast-root" class="toast-root" aria-live="polite"></div>
<script>
/* ==========================================================================
   DART SCOREBOARD: PURE LOGIC (no DOM access in this section)
   --------------------------------------------------------------------------
   PLAN
   Data model: store raw input, derive everything else.
     Match  = { id, createdAt, updatedAt, endedAt, status, mode, settings,
                players[{id,name,isBot,skill}], legs[{ events[] }], winnerId }
     Event  = {t:'d',s,m} one dart | {t:'tot',v,n} turn total | {t:'end'} end
              turn early | {t:'lock'} house rule Lock In.
     replayMatch(match) rebuilds every derived field (turn log per leg, leg
     winners, result type, locks, final scores, set and leg counts, live
     state) from the raw events. Undo pops the last event, Edit replaces the
     events of one turn, and both simply replay. Autosave stores only raw
     events (compact strings) so history stays small.
   Actions: dart, total, end, lock, undo, editTurn, restartLeg.
   House rule state machine per leg:
     normal play -> (manual Lock In | bust beyond allowance = auto-lock)
     -> final round (each other seat once, in seat order after the locker)
     -> resolution (lowest remaining; ties to locker, then earlier thrower).
     A valid checkout ends the leg at any moment, including the final round.
   Stat formulas (pure, (matches, filter) -> numbers, zero-safe):
     3-dart average = points / darts * 3. First-9 = first three turns of each
     leg, points / darts * 3. Double % and Triple % = hits / tracked darts.
     Checkout % = checkouts / darts thrown while one dart could finish.
     MPR = marks / darts * 3.
   ========================================================================== */
const DL = (() => {
  'use strict';

  /* ---------- constants ---------- */
  const APP_VERSION = '1.0.0';
  const BOARD_ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
  // Regulation board radii in millimetres.
  const RINGS = { innerBull: 6.35, outerBull: 15.9, tripleIn: 99, tripleOut: 107, doubleIn: 162, doubleOut: 170 };
  const X01_POINTS = [101, 201, 301, 401, 501, 601, 701, 801, 901, 1001];
  const IMPOSSIBLE_CHECKOUTS = [169, 168, 166, 165, 163, 162, 159];
  const SKILL_NAMES = ['', 'Beginner', 'Amateur', 'Intermediate', 'Advanced', 'Pro'];
  const SKILL_TARGET_AVG = [0, 25, 40, 55, 70, 90];
  // Gaussian spread (mm, per axis) calibrated by simulation to the averages above.
  const SKILL_SIGMA = [0, 35, 22, 15.4, 11.2, 7.6];
  const CRICKET_DEFAULT = [20, 19, 18, 17, 16, 15, 25];

  /* ---------- darts ---------- */
  function dartValue(s, m) {
    if (!s || !m) return 0;
    if (s === 25) return m === 2 ? 50 : 25;
    return s * m;
  }
  function validDart(d) {
    if (!d || typeof d.s !== 'number' || typeof d.m !== 'number') return false;
    if (d.s === 0) return d.m === 0;
    if (d.s === 25) return d.m === 1 || d.m === 2;
    return Number.isInteger(d.s) && d.s >= 1 && d.s <= 20 && (d.m === 1 || d.m === 2 || d.m === 3);
  }
  const isDoubleDart = (d) => !!d && d.s > 0 && d.m === 2;
  const isTripleDart = (d) => !!d && d.s > 0 && d.m === 3;
  function dartLabel(d) {
    if (!d) return '';
    if (d.total) return '·';
    if (!d.s) return 'M';
    if (d.s === 25) return d.m === 2 ? 'Bull' : '25';
    return (d.m === 2 ? 'D' : d.m === 3 ? 'T' : '') + d.s;
  }
  function parseDartLabel(str) {
    if (str === 'Bull') return { s: 25, m: 2 };
    if (str === '25') return { s: 25, m: 1 };
    if (str === 'M') return { s: 0, m: 0 };
    const m = str[0] === 'T' ? 3 : str[0] === 'D' ? 2 : 1;
    const s = parseInt(/^[SDT]/.test(str) ? str.slice(1) : str, 10);
    return { s, m };
  }

  const ALL_DARTS = (() => {
    const a = [];
    for (let s = 1; s <= 20; s++) a.push({ s, m: 1 }, { s, m: 2 }, { s, m: 3 });
    a.push({ s: 25, m: 1 }, { s: 25, m: 2 });
    return a;
  })();

  const POSSIBLE_TOTALS = (() => {
    const vals = [0, ...new Set(ALL_DARTS.map((d) => dartValue(d.s, d.m)))];
    const set = new Set();
    for (const a of vals) for (const b of vals) for (const c of vals) set.add(a + b + c);
    return set;
  })();
  const isPossibleTotal = (v) => Number.isInteger(v) && v >= 0 && v <= 180 && POSSIBLE_TOTALS.has(v);

  const neededWins = (format, n) => (format === 'bestOf' ? Math.ceil(n / 2) : n);

  /* ---------- checkout routes ---------- */
  function finishOk(d, rule) {
    if (!d || !d.s) return false;
    if (rule === 'straight') return true;
    if (rule === 'double') return d.m === 2;
    return d.m === 2 || d.m === 3; // master
  }
  function setupCost(d) {
    if (d.m === 3) {
      const t = { 20: 0, 19: 1, 18: 2, 17: 3, 16: 3.5, 15: 4, 14: 4.5, 13: 5, 12: 5.5, 11: 6, 10: 6.5 };
      return t[d.s] !== undefined ? t[d.s] : 7 + (10 - d.s) * 0.2;
    }
    if (d.m === 1) {
      if (d.s === 25) return 5;
      return 4 + (20 - d.s) * 0.15;
    }
    if (d.s === 25) return 6;
    return 9 + (20 - d.s) * 0.1;
  }
  const DOUBLE_PREF = { 20: 0, 16: 0.5, 8: 2, 18: 2, 12: 3, 10: 3, 4: 4, 14: 5, 6: 5, 2: 6, 25: 6, 19: 7, 17: 7, 15: 7, 13: 8, 11: 8, 9: 8, 7: 9, 5: 9, 3: 10, 1: 12 };
  function finishCost(d, rule) {
    if (d.m === 2) return DOUBLE_PREF[d.s];
    if (rule === 'master') return 3 + setupCost(d);
    return setupCost(d);
  }
  const FINISH_BY_VALUE = {};
  for (const rule of ['straight', 'double', 'master']) {
    const map = new Map();
    for (const d of ALL_DARTS) {
      if (!finishOk(d, rule)) continue;
      const v = dartValue(d.s, d.m);
      if (!map.has(v)) map.set(v, []);
      map.get(v).push(d);
    }
    FINISH_BY_VALUE[rule] = map;
  }
  const routeMemo = new Map();
  // Fewest darts first, then the most conventional route by cost.
  function searchRoute(rem, rule, maxDarts) {
    const key = rem + '|' + rule + '|' + maxDarts;
    if (routeMemo.has(key)) return routeMemo.get(key);
    let best = null;
    if (rem >= 1 && rem <= 180 && !(rule !== 'straight' && rem < 2)) {
      const fin = FINISH_BY_VALUE[rule];
      for (let k = 1; k <= maxDarts && !best; k++) {
        let bestCost = Infinity;
        const consider = (route, cost) => { if (cost < bestCost) { bestCost = cost; best = route; } };
        if (k === 1) {
          for (const f of fin.get(rem) || []) consider([f], finishCost(f, rule));
        } else if (k === 2) {
          for (const a of ALL_DARTS) {
            const need = rem - dartValue(a.s, a.m);
            if (need < 1) continue;
            for (const f of fin.get(need) || []) consider([a, f], (a.m === 3 ? 2 : 1) * setupCost(a) + finishCost(f, rule));
          }
        } else {
          for (const a of ALL_DARTS) {
            const va = dartValue(a.s, a.m);
            for (const b of ALL_DARTS) {
              const vb = dartValue(b.s, b.m);
              const need = rem - va - vb;
              if (need < 1) continue;
              for (const f of fin.get(need) || []) {
                consider([a, b, f], (a.m === 3 ? 2 : 1) * setupCost(a) + setupCost(b) + finishCost(f, rule) + (vb > va ? 0.05 : 0));
              }
            }
          }
        }
      }
    }
    routeMemo.set(key, best);
    return best;
  }
  const routeString = (route) => route.map(dartLabel).join(' ');

  // Standard Double Out routes (three darts available), 2 to 170.
  // prettier-ignore
  const CHECKOUT_TABLE = {
    170:'T20 T20 Bull', 167:'T20 T19 Bull', 164:'T20 T18 Bull', 161:'T20 T17 Bull', 160:'T20 T20 D20',
    158:'T20 T20 D19', 157:'T20 T19 D20', 156:'T20 T20 D18', 155:'T20 T19 D19', 154:'T20 T18 D20',
    153:'T20 T19 D18', 152:'T20 T20 D16', 151:'T20 T17 D20', 150:'T20 T18 D18', 149:'T20 T19 D16',
    148:'T20 T16 D20', 147:'T20 T17 D18', 146:'T20 T18 D16', 145:'T20 T15 D20', 144:'T20 T20 D12',
    143:'T20 T17 D16', 142:'T20 T14 D20', 141:'T20 T19 D12', 140:'T20 T20 D10', 139:'T20 T13 D20',
    138:'T20 T18 D12', 137:'T20 T19 D10', 136:'T20 T20 D8', 135:'T20 T17 D12', 134:'T20 T14 D16',
    133:'T20 T19 D8', 132:'T20 T20 D6', 131:'T20 T13 D16', 130:'T20 T18 D8', 129:'T20 T19 D6',
    128:'T20 T20 D4', 127:'T20 T17 D8', 126:'T20 T18 D6', 125:'T20 T19 D4', 124:'T20 T16 D8',
    123:'T20 T13 D12', 122:'T20 T18 D4', 121:'T20 T15 D8', 120:'T20 20 D20', 119:'T20 19 D20',
    118:'T20 18 D20', 117:'T20 17 D20', 116:'T20 16 D20', 115:'T20 15 D20', 114:'T20 14 D20', 113:'T20 13 D20',
    112:'T20 20 D16', 111:'T20 19 D16', 110:'T20 Bull', 109:'T20 17 D16', 108:'T20 16 D16', 107:'T19 Bull',
    106:'T20 14 D16', 105:'T20 13 D16', 104:'T18 Bull', 103:'T20 11 D16', 102:'T20 10 D16', 101:'T17 Bull',
    100:'T20 D20', 99:'T20 7 D16', 98:'T20 D19', 97:'T19 D20', 96:'T20 D18', 95:'T19 D19', 94:'T18 D20',
    93:'T19 D18', 92:'T20 D16', 91:'T17 D20', 90:'T18 D18', 89:'T19 D16', 88:'T20 D14', 87:'T17 D18',
    86:'T18 D16', 85:'T19 D14', 84:'T20 D12', 83:'T17 D16', 82:'Bull D16', 81:'T19 D12', 80:'T20 D10',
    79:'T13 D20', 78:'T18 D12', 77:'T19 D10', 76:'T20 D8', 75:'T17 D12', 74:'T18 D10', 73:'T19 D8',
    72:'T20 D6', 71:'T17 D10', 70:'T18 D8', 69:'T19 D6', 68:'T20 D4', 67:'T17 D8', 66:'Bull D8', 65:'25 D20',
    64:'T20 D2', 63:'T17 D6', 62:'T18 D4', 61:'25 D18', 60:'20 D20', 59:'19 D20', 58:'18 D20', 57:'17 D20',
    56:'16 D20', 55:'15 D20', 54:'14 D20', 53:'13 D20', 52:'20 D16', 51:'19 D16', 50:'Bull', 49:'17 D16',
    48:'16 D16', 47:'15 D16', 46:'14 D16', 45:'13 D16', 44:'12 D16', 43:'11 D16', 42:'10 D16', 41:'9 D16',
    40:'D20', 39:'7 D16', 38:'D19', 37:'5 D16', 36:'D18', 35:'19 D8', 34:'D17', 33:'17 D8', 32:'D16',
    31:'15 D8', 30:'D15', 29:'13 D8', 28:'D14', 27:'11 D8', 26:'D13', 25:'9 D8', 24:'D12', 23:'7 D8', 22:'D11',
    21:'5 D8', 20:'D10', 19:'3 D8', 18:'D9', 17:'1 D8', 16:'D8', 15:'7 D4', 14:'D7', 13:'5 D4', 12:'D6',
    11:'3 D4', 10:'D5', 9:'1 D4', 8:'D4', 7:'3 D2', 6:'D3', 5:'1 D2', 4:'D2', 3:'1 D1', 2:'D1',
  };

  function checkoutRoute(rem, rule, dartsLeft) {
    if (dartsLeft < 1 || rem < 1) return null;
    if (rule === 'double' && dartsLeft === 3) {
      const s = CHECKOUT_TABLE[rem];
      return s ? s.split(' ').map(parseDartLabel) : null;
    }
    return searchRoute(rem, rule, dartsLeft);
  }
  // A single dart could finish from this remaining score.
  function oneDartFinish(rem, rule) {
    return !!(FINISH_BY_VALUE[rule].get(rem) || []).length;
  }

  /* ---------- sectors (stats chart) ---------- */
  // 0 miss, 1..20 singles, 25, D1..D20, D25, T1..T20
  const X01_SECTOR_LABELS = (() => {
    const a = ['0'];
    for (let i = 1; i <= 20; i++) a.push(String(i));
    a.push('25');
    for (let i = 1; i <= 20; i++) a.push('D' + i);
    a.push('D25');
    for (let i = 1; i <= 20; i++) a.push('T' + i);
    return a;
  })();
  const X01_TICKS = ['0', '5', '10', '15', '25', 'D5', 'D10', 'D15', 'D25', 'T5', 'T10', 'T15', 'T20'];
  function sectorKey(d) {
    if (!d || !d.s || !d.m) return '0';
    if (d.m === 1) return String(d.s);
    return (d.m === 2 ? 'D' : 'T') + d.s;
  }
  function cricketSectorLabels(nums) {
    const singles = nums.filter((n) => n !== 25).sort((a, b) => a - b);
    const a = ['0'];
    singles.forEach((n) => a.push(String(n)));
    a.push('25');
    singles.forEach((n) => a.push('D' + n));
    a.push('D25');
    singles.forEach((n) => a.push('T' + n));
    return a;
  }

  function replayX01Leg(S, P, starter, events) {

    const rule = S.checkOut;

        if (cur && cur.darts.length) continue;
        const v = ev.v, nd = Math.max(1, Math.min(3, ev.n || 3));

      lockerSeat, lockerId: lockerSeat === null ? null : P[lockerSeat].id, lockedScore,

  }

  /* ---------- Cricket leg replay ---------- */
  function replayCricketLeg(S, P, starter, events) {
    const n = P.length, nums = S.numbers || CRICKET_DEFAULT, mode = S.scoring || 'standard';

    let seat = starter, cur = null, winnerSeat = null, consumed = 0, idx = 0;

      for (let o = 0; o < n; o++) {
        if (o === s) continue;

      if (winnerSeat !== null) break;

      consumed = idx + 1;

        if (!validDart(ev)) continue;
        if (!cur) startTurn();

  }

  /* ---------- match replay ---------- */

  // Turn state helpers used by the UI and the tests.

  /* ---------- dartboard model for bots ---------- */

  const SCORING_AIMS = (() => {

    for (let s = 20; s >= 1; s--) a.push({ s, m: 1 });

    { s: 20, m: 1 }, { s: 19, m: 1 }, { s: 18, m: 1 }, { s: 17, m: 1 }, { s: 16, m: 1 }, { s: 15, m: 1 }, { s: 25, m: 1 }];

  function chooseX01Aim(rem, dartsLeft, S, checkedIn, maxScore) {

  function botShouldLock(S, live, seat, skill) {

  function chooseCricketAim(S, live, seat) {

  /* ---------- statistics (pure) ---------- */

          if (t.score > a.maxScore) a.maxScore = t.score;
          if (t.score === 180) a.b180++; else if (t.score >= 140) a.b140++; else if (t.score >= 100) a.b100++; else if (t.score >= 60) a.b60++;
          if (!t.totalEntry) {
            for (const d of t.darts) {
              a.tracked++;
              if (isDoubleDart(d)) a.doubles++;
              if (isTripleDart(d)) a.triples++;
              a.sectors[X01_SECTOR_LABELS.indexOf(sectorKey(d))]++;
              if (d.ci !== false && oneDartFinish(d.rb, rule)) a.attempts++;
            }
          }
          if (t.checkout) {
            if (!t.totalEntry) a.checkouts++;
            if (t.start > a.maxCheckout) a.maxCheckout = t.start;
          }
          if (hr) {
            if (t.lockedThisTurn) a.locks++;
            if (t.busted) a.busts++;
            if (t.autoLocked) a.autoLocks++;
            if (t.isFinalTurn) { a.finalAttempts++; if (leg.winnerId === t.pid) a.finalWins++; }
          }
        }
        if (leg.resultType === 'checkout' && acc[leg.winnerId]) {
          const a = acc[leg.winnerId], nd = legDarts[leg.winnerId];
          if (!a.minDarts || nd < a.minDarts) a.minDarts = nd;
        }
      }
    }
    const rows = players.map((p) => {
      const a = acc[p.id];
      return Object.assign(a, {
        winPct: pct(a.wins, a.games), legPct: pct(a.legsWon, a.legs),
        dartsPerLeg: safeDiv(a.legDarts, a.legs), doublePct: pct(a.doubles, a.tracked), triplePct: pct(a.triples, a.tracked),
        avg: safeDiv(a.points, a.darts) * 3, first9: safeDiv(a.f9Points, a.f9Darts) * 3,
        checkoutPct: pct(a.checkouts, a.attempts),
      });
    });
    return { rows, hasData: ms.length > 0, hasHouse, labels: X01_SECTOR_LABELS, ticks: X01_TICKS, matchCount: ms.length };
  }

  function statsCricket(matches, filter) {
    const ms = filterMatches(matches, Object.assign({}, filter, { mode: 'cricket' }));
    const players = playerOrder(ms, filter);
    const numSet = new Set();
    ms.forEach((m) => (m.settings.numbers || CRICKET_DEFAULT).forEach((x) => numSet.add(x)));
    if (!numSet.size) CRICKET_DEFAULT.forEach((x) => numSet.add(x));
    const labels = cricketSectorLabels([...numSet]);
    const acc = {};
    players.forEach((p) => {
      acc[p.id] = { id: p.id, name: p.name, isBot: !!p.isBot, games: 0, wins: 0, legs: 0, legsWon: 0, darts: 0, rounds: 0,
        marks: 0, triples: 0, bulls: 0, points: 0, maxMarks: 0, sectors: labels.map(() => 0) };
    });
    for (const m of ms) {
      m.players.forEach((p) => { const a = acc[p.id]; if (a) { a.games++; if (m.winnerId === p.id) a.wins++; } });
      for (const leg of m.legs) {
        if (!leg.winnerId || !leg.turns) continue;
        m.players.forEach((p) => { const a = acc[p.id]; if (a) { a.legs++; if (leg.winnerId === p.id) a.legsWon++; } });
        for (const t of leg.turns) {
          const a = acc[t.pid]; if (!a) continue;
          a.rounds++; a.darts += t.darts.length; a.marks += t.marks; a.points += t.points;
          if (t.marks > a.maxMarks) a.maxMarks = t.marks;
          for (const d of t.darts) {
            if (d.m === 3 && d.s) a.triples++;
            if (d.s === 25) a.bulls++;
            const i = labels.indexOf(sectorKey(d));
            a.sectors[i < 0 ? 0 : i]++;
          }
        }
      }
    }
    const rows = players.map((p) => {
      const a = acc[p.id];
      return Object.assign(a, { winPct: pct(a.wins, a.games), legPct: pct(a.legsWon, a.legs), mpr: safeDiv(a.marks, a.darts) * 3, ppr: safeDiv(a.points, a.rounds) });
    });
    const ticks = labels.filter((l, i) => i === 0 || l === '25' || l === 'D25' || /^[DT]?(15|20)$/.test(l));
    return { rows, hasData: ms.length > 0, labels, ticks, matchCount: ms.length };
  }

  // Live per-match numbers for the in-game cards (all turns of the match so far).
  function matchPlayerTotals(match, rs) {
    const out = {};
    match.players.forEach((p) => (out[p.id] = { darts: 0, points: 0, marks: 0 }));
    match.legs.forEach((leg) => (leg.turns || []).forEach((t) => {
      const o = out[t.pid]; if (!o) return;
      o.darts += t.darts.length;
      o.points += match.mode === 'cricket' ? t.points : t.score;
      o.marks += t.marks || 0;
    }));
    if (rs && rs.live && rs.live.current) {
      const c = rs.live.current, o = out[c.pid];
      o.darts += c.darts.length;
      if (match.mode === 'cricket') o.marks += c.marks;
      else o.points += c.start - rs.live.rem[c.seat];
    }
    return out;
  }

  /* ---------- compact serialisation of raw events ---------- */
  function encodeEvent(e) {
    if (e.t === 'd') return e.s ? 'MSDT'[e.m] + e.s : 'M';
    if (e.t === 'tot') return 'X' + e.v + '/' + (e.n || 3);
    if (e.t === 'end') return 'E';
    if (e.t === 'lock') return 'L';
    return '';
  }
  function decodeEvent(str) {
    if (typeof str !== 'string') return str && str.t ? str : null;
    if (str === 'M') return { t: 'd', s: 0, m: 0 };
    if (str === 'E') return { t: 'end' };
    if (str === 'L') return { t: 'lock' };
    if (str[0] === 'X') { const [v, n] = str.slice(1).split('/'); return { t: 'tot', v: +v, n: +n || 3 }; }
    const m = 'MSDT'.indexOf(str[0]);
    return { t: 'd', s: +str.slice(1), m };
  }

  /* ---------- self-tests ---------- */
  function runSelfTests() {
    const results = [];
    const test = (name, fn) => {

      catch (e) { results.push({ name, pass: false, detail: e.message }); }
    };
    const P2 = [{ id: 'a', name: 'A' }, { id: 'b', name: 'B' }];
    const P3 = [{ id: 'a', name: 'A' }, { id: 'b', name: 'B' }, { id: 'c', name: 'C' }];
    const X = (o) => Object.assign({ points: 301, checkIn: 'straight', checkOut: 'double', format: 'firstTo', sets: 1, legs: 1, houseRule: { oneBustLowScore: false, bustAllowance: 1 } }, o || {});
    const HR = (o) => X(Object.assign({ houseRule: { oneBustLowScore: true, bustAllowance: 1 } }, o || {}));
    const D = (lbl) => Object.assign({ t: 'd' }, parseDartLabel(lbl));

    const leg = (S, P, str, starter) => replayX01Leg(S, P, starter || 0, ev(str));
    const mkMatch = (S, P, mode) => ({ mode: mode || 'x01', settings: S, players: P, legs: [{ events: [] }] });

    test('Bust reverts the score and scores zero', () => {
      const r = leg(X({ points: 50 }), P2, 'T20');
      const t = r.turns[0];

    });
    test('Double Out: leaving 1 is a bust', () => {
      const r = leg(X({ points: 41 }), P2, 'T20 S20');

    });
    test('Double Out: finishing on a single is a bust', () => {
      const r = leg(X({ points: 40 }), P2, 'T10 S10');
      return (r.turns[0].busted && r.winnerId === null) || 'no bust';
    });
    test('Double In: nothing scores before a double', () => {
      const r = leg(X({ checkIn: 'double' }), P2, 'T20 T20 D10');

    test('Master Out: triple finishes, single busts', () => {
      const a = leg(X({ points: 60, checkOut: 'master' }), P2, 'T20');

    test('Straight Out: exact zero wins on any dart', () => {

    test('Starter rotation across legs and sets', () => {

      const starters = [];

        const st = m.players[rs.live.seat].id;
        starters.push(st);
        m.legs[m.legs.length - 1].events = legFor(st);
      }

      return (starters.join('') === 'abba' && rs.winnerId === 'a' && rs.setsWon.a === 2) || starters.join('');

      const m = mkMatch(X({ points: 101, checkOut: 'straight' }), [{ id: 'a', name: 'A' }]);
      m.legs[0].events = [{ t: 'tot', v: 60, n: 3 }, D('S20'), D('S20'), D('S1')];
      replayMatch(m); m.status = 'finished'; m.endedAt = Date.now();

      return (z && !s.hasData && !c.hasData && s.rows.length === 0) || 'unsafe';
    });
    test('Checkout table: 170, 100, 40 and impossible finishes', () => {
      const ok = CHECKOUT_TABLE[170] === 'T20 T20 Bull' && CHECKOUT_TABLE[100] === 'T20 D20' && CHECKOUT_TABLE[40] === 'D20';
      const none = IMPOSSIBLE_CHECKOUTS.every((v) => !CHECKOUT_TABLE[v] && !checkoutRoute(v, 'double', 3));
      let valid = true;
      for (let v = 2; v <= 170; v++) {
        const r = CHECKOUT_TABLE[v];
        if (IMPOSSIBLE_CHECKOUTS.includes(v)) continue;
        if (!r) { valid = 'missing ' + v; break; }
        const ds = r.split(' ').map(parseDartLabel);

      }

    });
    test('Impossible three-dart totals are rejected', () => [179, 178, 176, 175, 173, 172, 169, 166, 163].every((v) => !isPossibleTotal(v)) && isPossibleTotal(180) && isPossibleTotal(177) && !isPossibleTotal(181));
    test('Sector chart order: 0, 1-20, 25, D1-D20, D25, T1-T20', () => {
      const L = X01_SECTOR_LABELS;
      return (L.length === 63 && L[0] === '0' && L[1] === '1' && L[20] === '20' && L[21] === '25' && L[22] === 'D1' && L[41] === 'D20' && L[42] === 'D25' && L[43] === 'T1' && L[62] === 'T20') || L.join(',');
    });
    test('Board geometry maps to real sectors', () => {
      const t20 = landingDart(0, 103), d6 = landingDart(166, 0), bull = landingDart(0, 0), s3 = landingDart(0, -135), miss = landingDart(0, 180);

    });
    test('Bots never return an illegal dart', () => {

      for (const mode of ['x01', 'cricket']) {
        const S = mode === 'x01' ? HR({ points: 301 }) : { scoring: 'standard', numbers: CRICKET_DEFAULT, format: 'firstTo', sets: 1, legs: 1 };
        const m = mkMatch(S, [{ id: 'a', name: 'A', isBot: true, skill: 2 }, { id: 'b', name: 'B', isBot: true, skill: 5 }], mode);
        for (let i = 0; i < 3000; i++) {

    });
    const CS = (scoring) => ({ scoring, numbers: CRICKET_DEFAULT, format: 'firstTo', sets: 1, legs: 1 });
    test('Cricket: extra marks score while an opponent is open', () => {
      const r = replayCricketLeg(CS('standard'), P2, 0, ev('T20 T20'));
      return (r.marks[0][20] === 3 && r.points[0] === 60) || 'points ' + r.points[0];
    });
    test('Cricket: closed by everyone means dead, no points', () => {
      const r = replayCricketLeg(CS('standard'), P2, 0, ev('T20 M M T20 M M T20'));

    test('House rule: Undo across a lock restores normal play', () => {

    });
    test('House rule: Undo of an auto-lock bust restores the bust counter', () => {
      const m = mkMatch(HR({ points: 50 }), P2);

    test('Event encoding round-trips', () => {

/* ==========================================================================

(() => {

  const fmt2 = (n) => (Number.isFinite(n) ? n : 0).toFixed(2);

  /* ---------- icons ---------- */
  function gear(cx, cy, r, teeth) {
    const pts = [], inner = r * 0.78;

      const rad = i % 2 ? inner : r;
      const a0 = ((i - 0.35) / (teeth * 2)) * Math.PI * 2, a1 = ((i + 0.35) / (teeth * 2)) * Math.PI * 2;

  /* ---------- statistics tab ---------- */
  function statsFilter() {
    const f = store.statsFilter;
    return { range: f.range, hidden: f.hidden, order: store.players.map((p) => p.id), now: Date.now() };
  }
  function statTable(cols, rows, cells) {
    return `<div class="table-wrap"><table class="stat"><thead><tr><th scope="col">Players</th>${cols.map((c) => `<th scope="col">${c}</th>`).join('')}</tr></thead>
      <tbody>${rows.map((r, i) => {
        const fs = r.name.length > 14 ? 12 : r.name.length > 10 ? 13.5 : 15;
        return `<tr><td style="font-size:${fs}px"><span class="pidx">${i + 1}.</span><span class="${r.isBot ? 'bot-name' : ''}">${esc(r.name)}</span></td>${cells(r).map((v) => `<td>${v}</td>`).join('')}</tr>`;
      }).join('')}</tbody></table></div>`;
  }
  function sectorChart(title, counts, labels, ticks) {
    const left = 4, right = 26, top = 10, h = 120, bottom = 22;
    const W = 344, slot = (W - left - right) / labels.length, H = top + h + bottom;
    const bw = Math.max(2, Math.min(4, slot * 0.6));
    const max = Math.max(0, ...counts);
    const step = max <= 50 ? 10 : max <= 100 ? 20 : max <= 250 ? 50 : max <= 500 ? 100 : Math.ceil(max / 5 / 100) * 100;
    const yMax = Math.max(step, Math.ceil(max / step) * step);
    const y = (v) => top + h - (v / yMax) * h;
    let g = '';
    for (let v = step; v <= yMax; v += step) {
      g += `<line x1="${left}" x2="${W - right + 4}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grid)" stroke-width="1"/>`;
      g += `<text x="${W - right + 8}" y="${y(v) + 4}" font-size="10" fill="var(--muted)">${v}</text>`;
    }
    g += `<line x1="${left}" x2="${W - right + 4}" y1="${y(0)}" y2="${y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
    labels.forEach((l, i) => {
      if (!ticks.includes(l)) return;
      const x = left + i * slot + slot / 2;
      g += `<line x1="${x}" x2="${x}" y1="${top}" y2="${y(0)}" stroke="var(--grid)" stroke-dasharray="2 3" stroke-width="1"/>`;
      g += `<text x="${x}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="middle">${l}</text>`;
    });
    counts.forEach((c, i) => {
      if (!c) return;
      const x = left + i * slot + slot / 2 - bw / 2;
      g += `<rect x="${x}" y="${y(c)}" width="${bw}" height="${Math.max(1, y(0) - y(c))}" rx="1" fill="var(--bar)"><title>${labels[i]}: ${c}</title></rect>`;
    });
    return `<div class="chart-card"><h3>${title}</h3><div class="chart-scroll"><svg style="width:100%;min-width:300px;height:auto" viewBox="0 0 ${W} ${H}" role="img" aria-label="Hits per sector, highest ${max}">${g}</svg></div></div>`;
  }
  function renderStats() {
    const f = store.statsFilter;
    const head = topbar('Statistics', `<button class="circle-btn" data-act="stats-filter" aria-label="Choose players and reset statistics">${I.menu}</button>`) +
      seg('stats-mode', [['x01', 'X01'], ['cricket', 'Cricket']], f.mode) +
      seg('stats-range', [['today', 'Today'], ['7d', '7 Days'], ['30d', '30 Days'], ['all', 'All time']], f.range, 'small');
    const sec = (t, inner, extra) => `<h2 class="stat-h">${t}${extra || ''}</h2>${inner}`;
    const none = '<div class="no-data">No data yet</div>';
    if (f.mode === 'x01') {
      const s = DL.statsX01(store.matches, statsFilter());
      const R = s.rows, ok = s.hasData && R.length;
      const T = (cols, cells) => (ok ? statTable(cols, R, cells) : none);
      const info = `<button class="info-btn" data-act="info" aria-expanded="${ui.infoOpen}" aria-label="How checkout percentage is calculated">${I.info}</button>`;
      let html = head;
      html += sec('Games', T(['Games', 'Wins', 'Wins %'], (r) => [r.games, r.wins, fmtPct(r.winPct)]));
      html += sec('Legs', T(['Legs', 'Legs won', 'Legs win %'], (r) => [r.legs, r.legsWon, fmtPct(r.legPct)]));
      html += sec('Throws', T(['Throws ⌀', 'Double %', 'Triple %'], (r) => [fmt2(r.dartsPerLeg), fmtPct(r.doublePct), fmtPct(r.triplePct)]));
      html += sec('Average and Highest Score', T(['Average ⌀', 'First-9 ⌀', 'Max Score'], (r) => [fmt2(r.avg), fmt2(r.first9), r.maxScore]));
      html += sec('Points', T(['60+', '100+', '140+', '180'], (r) => [r.b60, r.b100, r.b140, r.b180]));
      html += sec('Checkout', (ui.infoOpen ? `<p class="popover" id="co-info">Checkout % is successful checkouts divided by darts thrown while one dart could finish the leg under that match's check-out rule (for Double Out: 40 or less and even, or 50). Legs decided by low score and turns entered as a total do not count. Min Darts is the fewest darts in a leg won by checkout.</p>` : '') +
        T(['Max Checkout', 'Min Darts', 'Checkout %'], (r) => [r.maxCheckout, r.minDarts || 0, fmtPct(r.checkoutPct)]), info);
      if (ok && s.hasHouse) {
        html += sec(HOUSE_NAME, statTable(['Locks', 'Busts', 'Auto-locks', 'Final-round wins'], R, (r) => [r.locks, r.busts, r.autoLocks, `${r.finalWins} / ${r.finalAttempts}`]) +
          '<p class="hint">Busts count only in house rule matches. Final-round wins are legs won after taking a final turn.</p>');
      }
      html += sec('Hits in Sector', ok ? R.map((r, i) => sectorChart(`<span class="pidx">${i + 1}.</span> <span class="${r.isBot ? 'bot-name' : ''}">${esc(r.name)}</span>`, r.sectors, s.labels, s.ticks)).join('') : none);
      return html;
    }
    const s = DL.statsCricket(store.matches, statsFilter());
    const R = s.rows, ok = s.hasData && R.length;
    const T = (cols, cells) => (ok ? statTable(cols, R, cells) : none);
    let html = head;
    html += sec('Games', T(['Games', 'Wins', 'Wins %'], (r) => [r.games, r.wins, fmtPct(r.winPct)]));
    html += sec('Legs', T(['Legs', 'Legs won', 'Legs win %'], (r) => [r.legs, r.legsWon, fmtPct(r.legPct)]));
    html += sec('MPR', T(['MPR ⌀', 'Rounds', 'Darts'], (r) => [fmt2(r.mpr), r.rounds, r.darts]));
    html += sec('Marks', T(['Marks', 'Triples', 'Bulls'], (r) => [r.marks, r.triples, r.bulls]));
    html += sec('Points per Round', T(['Points', 'Per round ⌀'], (r) => [r.points, fmt2(r.ppr)]));
    html += sec('Highest Marks in a Turn', T(['Max marks'], (r) => [r.maxMarks]));
    html += sec('Hits in Sector', ok ? R.map((r, i) => sectorChart(`<span class="pidx">${i + 1}.</span> <span class="${r.isBot ? 'bot-name' : ''}">${esc(r.name)}</span>`, r.sectors, s.labels, s.ticks)).join('') : none);
    return html + '<p class="hint">Marks count darts that closed a number or scored on it.</p>';
  }

  /* ---------- all games tab ---------- */
  function renderGames() {
    const gf = store.gamesFilter;
    const allPlayers = new Map();
    store.matches.forEach((m) => m.players.forEach((p) => allPlayers.set(p.id, p)));
    const list = store.matches.filter((m) => (gf.mode === 'all' || m.mode === gf.mode) && (!gf.player || m.players.some((p) => p.id === gf.player)))
      .slice().sort((a, b) => (b.endedAt || b.updatedAt || b.createdAt) - (a.endedAt || a.updatedAt || a.createdAt));
    const filters = `<div class="filters">${seg('games-mode', [['all', 'All'], ['x01', 'X01'], ['cricket', 'Cricket']], gf.mode, 'small')}
      <label class="sr-only" for="games-player">Filter by player</label>
      <select class="select" id="games-player" data-change="games-player"><option value="">All players</option>${[...allPlayers.values()].map((p) => `<option value="${p.id}" ${gf.player === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>`;

      : `<div class="empty">${I.history}<strong>${store.matches.length ? 'No games match this filter' : 'No games yet'}</strong>${store.matches.length ? 'Try another mode or player.' : 'Finished and unfinished matches appear here.'}</div>`;
    return topbar('All Games') + (store.matches.length ? filters : '') + body;
  }
  function gameItem(m) {
    const when = new Date(m.endedAt || m.createdAt);
    const date = when.toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
    const winner = m.players.find((p) => p.id === m.winnerId);
    const unfinished = m.status !== 'finished';
    const status = m.status === 'abandoned' ? '<span class="chip muted">Abandoned</span>' : unfinished ? '<span class="chip green">In progress</span>' : '';
    return `<li class="game-item"><button class="gi-main" data-act="open-match" data-id="${m.id}">
      <div class="gi-top"><span>${esc(date)}</span><span class="chip">${m.mode === 'x01' ? 'X01' : 'Cricket'}</span>${isHouse(m) ? `<span class="chip amber">${HOUSE_NAME}</span>` : ''}${status}</div>
      <div class="gi-settings">${esc(settingsSummary(m))}</div>
      <div class="gi-players">${m.players.map(nameHtml).join(', ')}</div>
      <div class="gi-result">${winner ? `${I.trophy}${nameHtml(winner)} won · ${esc(scoreLine(m))}` : `Score ${esc(scoreLine(m))}`}</div>
    </button><div class="gi-actions">${unfinished ? `<button class="pill-btn green" data-act="resume" data-id="${m.id}">Resume</button>` : ''}
      <button class="icon-plain" data-act="delete-match" data-id="${m.id}" aria-label="Delete this match">${I.trash}</button></div></li>`;
  }

  /* ---------- match detail ---------- */
  function renderDetail() {
    const m = matchById(ui.detailId), rs = m._rs, S = m.settings;
    const back = `<button class="icon-plain" data-act="detail-back" aria-label="Back">${I.back}</button>`;
    const winner = m.players.find((p) => p.id === m.winnerId);
    const unfinished = m.status !== 'finished';
    const when = new Date(m.createdAt).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
    let html = topbar('Match', ui.detailFrom === 'game' ? '' : `<button class="icon-plain" data-act="delete-match" data-id="${m.id}" aria-label="Delete this match">${I.trash}</button>`, back);
    html += `<div class="card"><div class="gi-top"><span>${esc(when)}</span><span class="chip">${m.mode === 'x01' ? 'X01' : 'Cricket'}</span>${isHouse(m) ? `<span class="chip amber">${HOUSE_NAME}</span>` : ''}</div>
      <div class="gi-settings">${esc(settingsSummary(m))}</div><div class="gi-players">${m.players.map(nameHtml).join(', ')}</div>
      <div class="gi-result">${winner ? `${I.trophy}${nameHtml(winner)} won · ${esc(scoreLine(m))}` : `${m.status === 'abandoned' ? 'Abandoned' : 'In progress'} · ${esc(scoreLine(m))}`}</div>
      ${unfinished && ui.detailFrom !== 'game' ? `<div class="btn-row"><button class="pill-btn green" data-act="resume" data-id="${m.id}">Resume</button></div>` : ''}
      ${ui.detailFrom === 'game' ? `<div class="btn-row"><button class="pill-btn green" data-act="detail-back">Back to the game</button></div>` : ''}</div>`;
    // per-player stats
    const f = { range: 'all', includeUnfinished: true, order: m.players.map((p) => p.id) };
    if (m.mode === 'x01') {
      const s = DL.statsX01([m], f);
      html += '<h2 class="stat-h">Players</h2>' + statTable(['Avg ⌀', 'First-9', 'Max', 'Legs'], s.rows, (r) => [fmt2(r.avg), fmt2(r.first9), r.maxScore, r.legsWon]);
      html += '<div style="height:8px"></div>' + statTable(['Darts', '100+', '180', 'Best out'], s.rows, (r) => [r.darts, r.b100 + r.b140, r.b180, r.maxCheckout]);
    } else {
      const s = DL.statsCricket([m], f);
      html += '<h2 class="stat-h">Players</h2>' + statTable(['MPR', 'Marks', 'Points', 'Legs'], s.rows, (r) => [fmt2(r.mpr), r.marks, r.points, r.legsWon]);
    }
    // leg timeline
    const pn = (id) => { const p = m.players.find((x) => x.id === id); return p ? nameHtml(p) : '?'; };
    html += '<h2 class="stat-h">Legs</h2><div class="card">' + m.legs.map((leg, li) => {
      if (!leg.turns || (!leg.turns.length && !leg.winnerId && !leg.events.length)) return li === 0 ? '<div class="leg-line">No darts thrown yet.</div>' : '';
      const lbl = `${S.sets > 1 ? `Set ${leg.setNo} · ` : ''}Leg ${leg.legNo}`;
      let txt;
      if (!leg.winnerId) txt = 'In progress';
      else if (leg.resultType === 'lowScore') txt = `${pn(leg.winnerId)} won on low score (${leg.finalScores[leg.winnerId]} left)`;
      else if (m.mode === 'x01') { const last = leg.turns[leg.turns.length - 1]; const nd = leg.turns.filter((t) => t.pid === leg.winnerId).reduce((a, t) => a + t.darts.length, 0); txt = `${pn(leg.winnerId)} checked out ${last.start} in ${nd} darts`; }
      else txt = `${pn(leg.winnerId)} closed out (${leg.finalScores[leg.winnerId]} points)`;
      if (isHouse(m) && leg.lockerId) {
        const auto = leg.turns.some((t) => t.autoLocked && t.pid === leg.lockerId);
        txt += `<br><span class="lock-tag">${I.lock}${pn(leg.lockerId)} ${auto ? 'auto-locked' : 'locked'} at ${leg.lockedScore}</span>`;
      }
      if (isHouse(m) && leg.bustCounts) {
        const b = m.players.filter((p) => leg.bustCounts[p.id]).map((p) => `${esc(p.name)} ${leg.bustCounts[p.id]}`);
        if (b.length) txt += `<br><span style="color:var(--muted)">Busts: ${b.join(', ')}</span>`;
      }
      return `<div class="leg-line"><span class="lno">${lbl}</span><span>${txt}</span></div>`;
    }).join('') + '</div>';
    // turn log
    html += '<h2 class="stat-h">Turn log</h2>';
    const legsWithTurns = m.legs.map((leg, li) => ({ leg, li })).filter((x) => x.leg.turns && x.leg.turns.length);
    if (!legsWithTurns.length) html += '<div class="no-data">No turns yet</div>';
    html += legsWithTurns.map(({ leg, li }, k) => `<details class="turns" ${k === legsWithTurns.length - 1 ? 'open' : ''}><summary>${S.sets > 1 ? `Set ${leg.setNo} · ` : ''}Leg ${leg.legNo}</summary>
      ${leg.turns.map((t, ti) => {
        const p = m.players.find((x) => x.id === t.pid);
        const darts = t.totalEntry ? 'Total' : t.darts.map(DL.dartLabel).join(' ') || '-';
        let flags = '';
        if (t.busted) flags += '<span class="flag bust">BUST</span>';
        if (t.lockedThisTurn) flags += '<span class="flag lock">LOCK</span>';
        if (t.autoLocked) flags += '<span class="flag lock">AUTO-LOCK</span>';
        if (t.isFinalTurn) flags += '<span class="flag final">FINAL</span>';
        if (t.checkout || t.win) flags += '<span class="flag co">OUT</span>';
        const right = m.mode === 'x01' ? `${t.score} <span style="color:var(--muted)">→ ${t.end}</span>` : `${t.marks} mk${t.points ? ' · ' + t.points : ''}`;
        return `<div class="trow"><span class="tn">${nameHtml(p)}${flags}</span><span class="td">${esc(darts)}</span><span class="ts">${right}</span>
          <button class="icon-plain" data-act="edit-turn" data-li="${li}" data-ti="${ti}" aria-label="Edit ${esc(p.name)}'s turn ${ti + 1}">${I.edit}</button></div>`;
      }).join('')}</details>`).join('');
    return `<main class="app" id="main">${html}</main>`;
  }
